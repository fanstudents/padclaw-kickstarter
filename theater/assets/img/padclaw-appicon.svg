<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="PadClaw">
  <title>PadClaw</title>
  <defs>
    <linearGradient id="pca-bg" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#161C24"/>
      <stop offset=".55" stop-color="#0F141B"/>
      <stop offset="1" stop-color="#0A0E13"/>
    </linearGradient>
    <linearGradient id="pca-paw" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#0FF598"/>
      <stop offset=".55" stop-color="#05CE78"/>
      <stop offset="1" stop-color="#04A05E"/>
    </linearGradient>
    <radialGradient id="pca-glow" cx=".5" cy=".56" r=".55">
      <stop offset="0" stop-color="#05CE78" stop-opacity=".38"/>
      <stop offset="1" stop-color="#05CE78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pca-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pca-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- 深炭 squircle 磚 -->
  <rect width="128" height="128" rx="29" fill="url(#pca-bg)"/>
  <rect width="128" height="128" rx="29" fill="url(#pca-gloss)"/>
  <rect x="1" y="1" width="126" height="126" rx="28" fill="none"
        stroke="#fff" stroke-opacity=".13" stroke-width="1.6"/>

  <!-- 掌印後方的呼吸光暈 -->
  <rect width="128" height="128" rx="29" fill="url(#pca-glow)"/>

  <!-- 掌印:發光體 -->
  <g filter="url(#pca-soft)" opacity=".55" fill="#05CE78">
    <ellipse cx="44.2" cy="50.8" rx="8.6" ry="11.6" transform="rotate(-18 44.2 50.8)"/>
    <ellipse cx="64"   cy="45.8" rx="9.1" ry="12.2"/>
    <ellipse cx="83.8" cy="50.8" rx="8.6" ry="11.6" transform="rotate(18 83.8 50.8)"/>
    <path d="M64 67.6c17.9 0 28.9 10.8 28.9 21.3 0 8.5-8.1 12.6-16 10.3-8.3-2.4-17.5-2.4-25.8 0-7.9 2.3-16-1.8-16-10.3 0-10.5 11-21.3 28.9-21.3Z"/>
  </g>
  <g fill="url(#pca-paw)">
    <ellipse cx="44.2" cy="50.8" rx="8.2" ry="11.1" transform="rotate(-18 44.2 50.8)"/>
    <ellipse cx="64"   cy="45.8" rx="8.7" ry="11.7"/>
    <ellipse cx="83.8" cy="50.8" rx="8.2" ry="11.1" transform="rotate(18 83.8 50.8)"/>
    <path d="M64 68.4c17.2 0 27.8 10.4 27.8 20.5 0 8.1-7.8 12.1-15.4 9.9-8-2.3-16.8-2.3-24.8 0-7.6 2.2-15.4-1.8-15.4-9.9 0-10.1 10.6-20.5 27.8-20.5Z"/>
  </g>
  <!-- 掌印頂部 specular -->
  <path d="M64 68.4c17.2 0 27.8 10.4 27.8 20.5l-.02.6C90 80.6 78.4 73.5 64 73.5s-26 7.1-27.78 16l-.02-.6c0-10.1 10.6-20.5 27.8-20.5Z"
        fill="#fff" opacity=".14"/>
</svg>
