<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="PadClaw">
  <title>PadClaw</title>
  <defs>
    <linearGradient id="pc3-bg" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#101A26"/>
      <stop offset=".55" stop-color="#0B1219"/>
      <stop offset="1" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="pc3-paw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BEBFF"/>
      <stop offset=".5" stop-color="#18DFA6"/>
      <stop offset="1" stop-color="#05CE78"/>
    </linearGradient>
    <radialGradient id="pc3-glow" cx=".5" cy=".56" r=".58">
      <stop offset="0" stop-color="#18DFA6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#18DFA6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pc3-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".38" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pc3-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#pc3-bg)"/>
  <rect width="128" height="128" rx="29" fill="url(#pc3-glow)"/>
  <rect width="128" height="128" rx="29" fill="url(#pc3-gloss)"/>
  <rect x="1" y="1" width="126" height="126" rx="28" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.6"/>

  <!-- 星塵 -->
  <g fill="#BFF3FF">
    <circle cx="22" cy="26" r="1.1" opacity=".5"/><circle cx="104" cy="20" r=".9" opacity=".38"/>
    <circle cx="112" cy="66" r="1.2" opacity=".42"/><circle cx="16" cy="84" r=".9" opacity=".34"/>
    <circle cx="96" cy="106" r="1" opacity=".3"/><circle cx="34" cy="110" r=".8" opacity=".3"/>
  </g>

  <!-- 掌印:光暈 + 極光漸層 + specular -->
  <g filter="url(#pc3-soft)" opacity=".6" fill="#18DFA6">
    <ellipse cx="44.2" cy="50.8" rx="8.6" ry="11.6" transform="rotate(-18 44.2 50.8)"/>
    <ellipse cx="64" cy="45.8" rx="9.1" ry="12.2"/>
    <ellipse cx="83.8" cy="50.8" rx="8.6" ry="11.6" transform="rotate(18 83.8 50.8)"/>
    <path d="M64 67.6c17.9 0 28.9 10.8 28.9 21.3 0 8.5-8.1 12.6-16 10.3-8.3-2.4-17.5-2.4-25.8 0-7.9 2.3-16-1.8-16-10.3 0-10.5 11-21.3 28.9-21.3Z"/>
  </g>
  <g fill="url(#pc3-paw)">
    <ellipse cx="44.2" cy="50.8" rx="8.2" ry="11.1" transform="rotate(-18 44.2 50.8)"/>
    <ellipse cx="64" cy="45.8" rx="8.7" ry="11.7"/>
    <ellipse cx="83.8" cy="50.8" rx="8.2" ry="11.1" transform="rotate(18 83.8 50.8)"/>
    <path d="M64 68.4c17.2 0 27.8 10.4 27.8 20.5 0 8.1-7.8 12.1-15.4 9.9-8-2.3-16.8-2.3-24.8 0-7.6 2.2-15.4-1.8-15.4-9.9 0-10.1 10.6-20.5 27.8-20.5Z"/>
  </g>
  <path d="M64 68.4c17.2 0 27.8 10.4 27.8 20.5l-.02.6C90 80.6 78.4 73.5 64 73.5s-26 7.1-27.78 16l-.02-.6c0-10.1 10.6-20.5 27.8-20.5Z"
        fill="#fff" opacity=".16"/>
</svg>
