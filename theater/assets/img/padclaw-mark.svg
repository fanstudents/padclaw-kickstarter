      <stop offset="0" stop-color="#2EE6FF"/>
      <stop offset=".5" stop-color="#18DFA6"/>
      <stop offset="1" stop-color="#05CE78"/>
    </linearGradient>
    <radialGradient id="pcm3-g" cx=".5" cy=".55" r=".62">
