    <path d="M16 16.85c4.2 0 6.8 2.54 6.8 5.02 0 2.02-1.9 3-3.76 2.44-1.95-.59-4.13-.59-6.08 0-1.86.56-3.76-.42-3.76-2.44 0-2.48 2.6-5.02 6.8-5.02Z"/>
